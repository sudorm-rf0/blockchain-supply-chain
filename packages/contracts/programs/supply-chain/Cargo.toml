[package]
name = "supply-chain"
version = "0.1.0"
edition = "2021"
description = "Solana supply chain program built with Anchor 0.31.1"

[lib]
name = "supply_chain"
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }

[features]
test-build = []
idl-build = ["anchor-lang/idl-build"]

[dev-dependencies]
solana-program-test = "2.0.0"
solana-sdk = "2.0.0"

[package]
name = "supply-chain"
version = "0.1.0"
edition = "2021"
description = "Solana supply chain program built with Anchor 0.31.1"

[lib]
name = "supply_chain"
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }

# 审计（supply-chain-project-evaluation 2026-08-08）：测试构建开关。
# 仅放宽 initialize_* 的 initial_delay 下限（验证治理时锁），不含任何白名单/后门。
# 主网/生产构建禁止携带（precheck-mainnet-deploy.sh 强制校验），上线前保持锁定。
[features]
test-build = []
idl-build = ["anchor-lang/idl-build"]

[dev-dependencies]
solana-program-test = "2.0.0"
solana-sdk = "2.0.0"

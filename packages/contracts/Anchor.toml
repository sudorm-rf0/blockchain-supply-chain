[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[programs.localnet]
supply_chain = "Dcxixk89HPaC6yHKk1rP5HGMFgBMcRrYku6ze951C6Lk"
trade_finance = "9c8eND94LxNZgDbhvApGsRKojHyxhgEVUBSUHU9tRVU3"

[programs.devnet]
supply_chain = "BGSBnaAs2uhsYhUA2KJBmirMcK551JLm9thy7P2y2cDh"
trade_finance = "8GSbCjUhgpvgQ35tx7wqFZCznP5HW2mn1jUYcGahC4tq"

# 审计 M-05：主网 Program ID 在部署时由 deploy-mainnet.sh 用部署 keypair 确定并同步到本段
# （--generate-keypairs 自动同步 declare_id! 与本段），禁止沿用 devnet 占位 ID。
[programs.mainnet]
supply_chain = "Dcxixk89HPaC6yHKk1rP5HGMFgBMcRrYku6ze951C6Lk"
trade_finance = "9c8eND94LxNZgDbhvApGsRKojHyxhgEVUBSUHU9tRVU3"

[workspace]
members = ["programs/supply-chain", "programs/trade-finance"]

[scripts]
test = "bash scripts/test-anchor.sh"

# ---- CI 说明 ----
# CI（.github/workflows/ci.yml contracts job）会从 GitHub Secrets
# （CONTRACTS_TRADE_KEYPAIR / CONTRACTS_SUPPLY_KEYPAIR）恢复本机缺失的
# devnet/localnet 程序 keypair，使地址与 declare_id! 一致，避免
# DeclaredProgramIdMismatch(4100)。主网 keypair 不在此列，保持离线冷存储。

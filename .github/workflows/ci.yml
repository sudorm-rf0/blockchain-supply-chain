name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      contracts: ${{ steps.changes.outputs.contracts }}
      e2e: ${{ steps.changes.outputs.e2e }}
      frontend-e2e: ${{ steps.changes.outputs.frontend-e2e }}
      docker: ${{ steps.changes.outputs.docker }}
      security: ${{ steps.changes.outputs.security }}
      backup: ${{ steps.changes.outputs.backup }}
      monitoring: ${{ steps.changes.outputs.monitoring }}
      scripts: ${{ steps.changes.outputs.scripts }}
      vps: ${{ steps.changes.outputs.vps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            backend:
              - 'packages/backend/**'
              - 'packages/common/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            frontend:
              - 'packages/frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            contracts:
              - 'packages/contracts/**'
              - 'scripts/init-localnet.mjs'
              - 'scripts/deploy-devnet.sh'
              - 'package.json'
              - 'pnpm-lock.yaml'
            e2e:
              - 'packages/backend/**'
              - 'packages/common/**'
              - 'packages/contracts/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            frontend-e2e:
              - 'packages/frontend/**'
              - 'packages/backend/**'
              - 'packages/common/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            docker:
              - 'Dockerfile.multistage'
              - 'packages/backend/**'
              - 'packages/common/**'
              - 'packages/frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            security:
              - 'packages/common/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            backup:
              - 'packages/common/**'
              - 'packages/backend/**'
              - 'scripts/db-backup-restore.sh'
              - 'package.json'
              - 'pnpm-lock.yaml'
            monitoring:
              - 'infra/**'
              - 'k8s/**'
              - 'scripts/verify-monitoring.sh'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            vps:
              - 'deploy/**'
              - 'scripts/deploy-vps.sh'
              - '.github/workflows/ci.yml'

  scripts-lint:
    runs-on: [self-hosted, macOS, ARM64]
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax check
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      - name: Verify deployment scripts are executable
        run: |
          test -x scripts/verify-deployment.sh
          test -x scripts/verify-contract-deployment.sh
          test -x scripts/rollback-drill.sh
          test -x scripts/precheck-mainnet-deploy.sh

  launch-preflight:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Preflight script syntax
        run: bash -n scripts/launch-preflight.sh

      - name: Preflight rejects missing governance vars
        run: |
          set +e
          bash scripts/launch-preflight.sh >/tmp/preflight-missing.log 2>&1
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "expected non-zero exit when vars missing"; exit 1; }
          grep -q "缺少必填环境变量" /tmp/preflight-missing.log

      - name: Preflight rejects invalid governance values
        run: |
          set +e
          SOLANA_RPC_URL=https://api.mainnet-beta.solana.com           DEPLOY_WALLET=EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v           TRADE_FINANCE_PROGRAM_ID=11111111111111111111111111111111           SUPPLY_CHAIN_PROGRAM_ID=TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA           USDC_MINT=EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v           LP_MINT=11111111111111111111111111111111           MULTISIG_ADMIN=11111111111111111111111111111111           UPGRADE_AUTHORITY_PLAN=invalid INITIAL_ADMIN_DELAY=172800           bash scripts/launch-preflight.sh --skip-precheck >/tmp/preflight-ua.log 2>&1
          rc_ua=$?
          UPGRADE_AUTHORITY_PLAN=cold-wallet INITIAL_ADMIN_DELAY=3600           bash scripts/launch-preflight.sh --skip-precheck >/tmp/preflight-delay.log 2>&1
          rc_delay=$?
          DEPLOY_WALLET=3rF9fK7KL2YmAsdGHFrsGTZHiKrqF7BRCZ88KRZ3nsK8           UPGRADE_AUTHORITY_PLAN=cold-wallet INITIAL_ADMIN_DELAY=172800           bash scripts/launch-preflight.sh --skip-precheck >/tmp/preflight-deployer.log 2>&1
          rc_deployer=$?
          set -e
          [ "$rc_ua" -ne 0 ] || { echo "expected reject: invalid UA plan"; exit 1; }
          [ "$rc_delay" -ne 0 ] || { echo "expected reject: delay < 86400"; exit 1; }
          [ "$rc_deployer" -ne 0 ] || { echo "expected reject: DEPLOY_WALLET == test DEPLOYER"; exit 1; }

      - name: Staging-verify orchestration smoke (all skip -> ALL PASS)
        run: |
          cat > /tmp/senv <<EOF
          PUBLIC_BASE_URL=https://staging.example.com
          DATABASE_URL=postgresql://u:p@127.0.0.1:5432/x
          SOLANA_RPC_URL=https://api.devnet.solana.com
          TRADE_FINANCE_PROGRAM_ID=9c8eND94LxNZgDbhvApGsRKojHyxhgEVUBSUHU9tRVU3
          USDC_MINT=EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
          EOF
          bash scripts/staging-verify.sh --env-file /tmp/senv             --skip-health --skip-deploy-verify --skip-monitoring --skip-backup --skip-rollback --skip-reconcile | tail -3
          grep -q "ALL PASS" <(bash scripts/staging-verify.sh --env-file /tmp/senv             --skip-health --skip-deploy-verify --skip-monitoring --skip-backup --skip-rollback --skip-reconcile | tail -3)

      - name: Preflight dry-run with placeholder governance vars (skip-precheck)
        run: |
          SOLANA_RPC_URL=https://api.mainnet-beta.solana.com           DEPLOY_WALLET=EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v           TRADE_FINANCE_PROGRAM_ID=11111111111111111111111111111111           SUPPLY_CHAIN_PROGRAM_ID=TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA           USDC_MINT=EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v           LP_MINT=11111111111111111111111111111111           MULTISIG_ADMIN=11111111111111111111111111111111           UPGRADE_AUTHORITY_PLAN=cold-wallet INITIAL_ADMIN_DELAY=172800           bash scripts/launch-preflight.sh --skip-precheck | tee /tmp/preflight-ok.log
          grep -q "launch-preflight 完成" /tmp/preflight-ok.log
          grep -q "Squads多签创建与Admin迁移手册" /tmp/preflight-ok.log

  network-policy:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Network policy generator is fail-closed (OFF-NET-1)
        run: |
          set -euo pipefail
          bash -n scripts/generate-network-policies.sh
          # 1) 无 CIDR 必须失败（不再静默宽放）
          set +e
          OUT=/tmp/np-missing.yaml bash scripts/generate-network-policies.sh >/tmp/np-missing.log 2>&1
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "expected fail-closed when CIDRs missing"; exit 1; }
          grep -q "missing required egress CIDRs" /tmp/np-missing.log
          # 2) 0.0.0.0/0 必须被拒绝
          set +e
          OUT=/tmp/np-wide.yaml SOLANA_RPC_CIDR=0.0.0.0/0 RISK_WEBHOOK_CIDR=198.51.100.5/32 S3_CIDR=192.0.2.0/24             bash scripts/generate-network-policies.sh >/tmp/np-wide.log 2>&1
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "expected reject wide-open 0.0.0.0/0"; exit 1; }
          # 3) 合法 CIDR 生成且不含宽放
          OUT=/tmp/np-ok.yaml SOLANA_RPC_CIDR=203.0.113.0/24 RISK_WEBHOOK_CIDR=198.51.100.5/32 S3_CIDR=192.0.2.0/24             bash scripts/generate-network-policies.sh >/dev/null
          ! grep -q "0.0.0.0/0\|::/0" /tmp/np-ok.yaml
          grep -q "203.0.113.0/24" /tmp/np-ok.yaml

  vps-deploy:
    runs-on: [self-hosted, macOS, ARM64]
    needs: changes
    if: needs.changes.outputs.vps == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Validate deploy-vps.sh syntax
        run: bash -n scripts/deploy-vps.sh

      - name: Validate data compose
        working-directory: deploy/vps
        run: |
          docker compose --env-file .env.data.example -f data-compose.yml config >/dev/null

      - name: Validate app compose
        working-directory: deploy/vps
        run: |
          cp .env.app.example .env.app
          docker compose --env-file .env.app -f app-compose.yml config >/dev/null

      - name: Validate nginx config
        run: |
          mkdir -p /tmp/nginx-cert/live/supply-chain.example.com
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=supply-chain.example.com"             -keyout /tmp/nginx-cert/live/supply-chain.example.com/privkey.pem             -out /tmp/nginx-cert/live/supply-chain.example.com/fullchain.pem 2>/dev/null
          docker run --rm -v "$PWD/deploy/vps/nginx.conf:/etc/nginx/conf.d/default.conf:ro"             -v /tmp/nginx-cert:/etc/letsencrypt:ro nginx:1.27-alpine nginx -t

  backend:
    runs-on: [self-hosted, macOS, ARM64]
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'pull_request'
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/supply_chain?connection_limit=10&pool_timeout=20&socket_timeout=30&schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        if: runner.os == 'Linux'
        with:
          version: 9.4.0

      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        working-directory: packages/backend
        run: pnpm exec prisma generate

      - name: Build shared common package
        run: pnpm --filter @supply-chain/common build

      - name: TypeScript Check (main backend)
        working-directory: packages/backend
        run: pnpm exec tsc --noEmit

      - name: TypeScript Check (indexer-service)
        working-directory: packages/backend
        run: pnpm exec tsc -p apps/indexer-service/tsconfig.app.json --noEmit

      - name: TypeScript Check (pool-service)
        working-directory: packages/backend
        run: pnpm exec tsc -p apps/pool-service/tsconfig.app.json --noEmit

      - name: TypeScript Check (trade-service)
        working-directory: packages/backend
        run: pnpm exec tsc -p apps/trade-service/tsconfig.app.json --noEmit

      - name: Lint
        working-directory: packages/backend
        run: pnpm lint

      - name: Tests
        working-directory: packages/backend
        run: pnpm exec jest --runInBand --coverage

  frontend:
    runs-on: [self-hosted, macOS, ARM64]
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        if: runner.os == 'Linux'
        with:
          version: 9.4.0

      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript Check
        working-directory: packages/frontend
        run: pnpm exec tsc --noEmit

      - name: Lint
        working-directory: packages/frontend
        run: pnpm lint

      - name: Component Tests
        working-directory: packages/frontend
        run: pnpm test -- --coverage

      - name: Production Build
        working-directory: packages/frontend
        run: pnpm build

  contracts:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Anchor CLI
        id: cache-anchor
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-0.31.1-${{ runner.os }}
      - name: Install Rust 1.79 (anchor-cli toolchain)
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: rustup toolchain install 1.79.0 --profile minimal --no-self-update
      - name: Build Anchor (cache miss)
        run: cargo +1.79.0 install --git https://github.com/coral-xyz/anchor --tag v0.31.1 anchor-cli --locked
        if: steps.cache-anchor.outputs.cache-hit != 'true'

      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@v6
        with:
          path: ~/.local/share/solana
          key: agave-4.1.2-${{ runner.os }}
      - name: Install Solana CLI (cache miss)
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URL="https://github.com/anza-xyz/agave/releases/download/v4.1.2/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          for i in 1 2 3; do
            if curl -sSfL --retry 3 --retry-all-errors --retry-delay 5 -o /tmp/solana-release.tar.bz2 "$URL"; then
              break
            fi
            sleep 5
          done
          rm -rf "$HOME/.local/share/solana"
          mkdir -p "$HOME/.local/share/solana"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$HOME/.local/share/solana"
          mv "$HOME/.local/share/solana/solana-release" "$HOME/.local/share/solana/active_release"
          echo "$HOME/.local/share/solana/active_release/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.local/share/solana/active_release/bin/cargo-build-sbf"

      - name: Add Solana CLI to PATH
        run: echo "$HOME/.local/share/solana/active_release/bin" >> "$GITHUB_PATH"

      - name: Anchor Build
        working-directory: packages/contracts
        run: anchor build

      - name: Test Typecheck
        working-directory: packages/contracts
        run: pnpm run test:typecheck

      - name: Anchor Tests
        working-directory: packages/contracts
        run: pnpm test

      - name: Cargo Unit Tests
        working-directory: packages/contracts
        run: |
          cargo test --manifest-path programs/supply-chain/Cargo.toml
          cargo test --manifest-path programs/trade-finance/Cargo.toml

      - name: Reproducible build check (two builds identical)
        working-directory: packages/contracts
        run: |
          bash ../scripts/reproducible-build.sh --verify-twice | tail -8
          # 链上字节码对比（部署后）：scripts/verify-reproducible.sh

  e2e:
    runs-on: [self-hosted, macOS, ARM64]
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || github.event_name == 'pull_request'
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:15432/supply_chain?connection_limit=10&pool_timeout=20&socket_timeout=30&schema=public
      REDIS_URL: redis://localhost:16379
      JWT_SECRET: ci-secret-for-tests-0123456789abcdef
      CI_RPC_PORT: "8901"
      CI_BACKEND_PORT: "3101"
      CI_INDEXER_PORT: "3103"
      CI_TRADE_PORT: "3104"
      CI_POOL_PORT: "3105"
      CI_SOLANA_HOME: "/tmp/solana-ci"

    steps:
      - uses: actions/checkout@v7

      - name: Start isolated Postgres and Redis
        run: |
          docker rm -f supply-chain-pg-ci supply-chain-redis-ci >/dev/null 2>&1 || true
          docker rm -f supply-chain-postgres-ci >/dev/null 2>&1 || true
          docker run -d --name supply-chain-pg-ci \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=supply_chain -p 15432:5432 postgres:15
          docker run -d --name supply-chain-redis-ci -p 16379:6379 redis:7
          for i in $(seq 1 30); do
            docker exec supply-chain-pg-ci pg_isready -U postgres >/dev/null 2>&1 &&
              docker exec supply-chain-redis-ci redis-cli ping >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec supply-chain-pg-ci pg_isready -U postgres >/dev/null
          docker exec supply-chain-redis-ci redis-cli ping >/dev/null

      - uses: pnpm/action-setup@v6
        if: runner.os == 'Linux'
        with:
          version: 9.4.0

      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        working-directory: packages/backend
        run: pnpm exec prisma generate

      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-0.31.1-e2e-${{ runner.os }}
      - name: Install Rust 1.79 (anchor-cli toolchain)
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: rustup toolchain install 1.79.0 --profile minimal --no-self-update
      - name: Build Anchor (cache miss)
        run: cargo +1.79.0 install --git https://github.com/coral-xyz/anchor --tag v0.31.1 anchor-cli --locked
        if: steps.cache-anchor.outputs.cache-hit != 'true'

      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@v6
        with:
          path: ~/.local/share/solana
          key: agave-4.1.2-e2e-${{ runner.os }}
      - name: Install Solana CLI (cache miss)
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Linux) ASSET="solana-release-x86_64-unknown-linux-gnu.tar.bz2" ;;
            Darwin) ASSET="solana-release-aarch64-apple-darwin.tar.bz2" ;;
            *) echo "unsupported OS"; exit 1 ;;
          esac
          URL="https://github.com/anza-xyz/agave/releases/download/v4.1.2/${ASSET}"
          for i in 1 2 3; do
            if curl -sSfL --retry 3 --retry-all-errors --retry-delay 5 -o /tmp/solana-release.tar.bz2 "$URL"; then
              break
            fi
            sleep 5
          done
          rm -rf "$HOME/.local/share/solana"
          mkdir -p "$HOME/.local/share/solana"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$HOME/.local/share/solana"
          mv "$HOME/.local/share/solana/solana-release" "$HOME/.local/share/solana/active_release"
          echo "$HOME/.local/share/solana/active_release/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.local/share/solana/active_release/bin/cargo-build-sbf"

      - name: Add Solana CLI to PATH
        run: echo "$HOME/.local/share/solana/active_release/bin" >> "$GITHUB_PATH"

      - name: Run End-to-End Smoke
        run: bash scripts/ci-e2e.sh

      - name: Cleanup CI containers
        if: always()
        run: docker rm -f supply-chain-pg-ci supply-chain-redis-ci supply-chain-postgres-ci >/dev/null 2>&1 || true

  frontend-e2e:
    runs-on: [self-hosted, macOS, ARM64]
    needs: changes
    if: needs.changes.outputs.frontend-e2e == 'true' || github.event_name == 'pull_request'
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:15432/supply_chain?connection_limit=10&pool_timeout=20&socket_timeout=30&schema=public
      REDIS_URL: redis://localhost:16379
      JWT_SECRET: ci-secret-for-tests-0123456789abcdef
      CI_BACKEND_PORT: "3101"
      CI_TRADE_PORT: "3104"
      CI_POOL_PORT: "3105"
      BACKEND_URL: "http://localhost:3101"
      TRADE_URL: "http://localhost:3104"
      POOL_URL: "http://localhost:3105"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:3101"
      NEXT_PUBLIC_TRADE_API_URL: "http://localhost:3104"
      NEXT_PUBLIC_POOL_API_URL: "http://localhost:3105"
      ALLOW_UNSCANNED_UPLOADS: "true"
      E2E_SERVER_MODE: "production"
      E2E_FRONTEND_PORT: "3110"
      E2E_BASE_URL: "http://localhost:3110"

    steps:
      - uses: actions/checkout@v7

      - name: Start isolated Postgres and Redis
        run: |
          docker rm -f supply-chain-pg-ci supply-chain-redis-ci >/dev/null 2>&1 || true
          docker rm -f supply-chain-postgres-ci >/dev/null 2>&1 || true
          docker run -d --name supply-chain-pg-ci \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=supply_chain -p 15432:5432 postgres:15
          docker run -d --name supply-chain-redis-ci -p 16379:6379 redis:7
          for i in $(seq 1 30); do
            docker exec supply-chain-pg-ci pg_isready -U postgres >/dev/null 2>&1 &&
              docker exec supply-chain-redis-ci redis-cli ping >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec supply-chain-pg-ci pg_isready -U postgres >/dev/null
          docker exec supply-chain-redis-ci redis-cli ping >/dev/null

      - uses: pnpm/action-setup@v6
        if: runner.os == 'Linux'
        with:
          version: 9.4.0

      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        working-directory: packages/backend
        run: pnpm exec prisma generate

      - name: Build backend services
        working-directory: packages/backend
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed
          pnpm --filter @supply-chain/common build
          pnpm build
          pnpm build:trade
          pnpm build:pool

      - name: Start backend services
        working-directory: packages/backend
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          # e2e 用本地 validator，外网 RPC 预检仅作观察；self-hosted 网络不通时降级不阻塞
          RPC_CHECK_ALLOW_FAIL: "1"
        run: |
          THROTTLE_LIMIT=100000 PORT="$CI_BACKEND_PORT" pnpm start > /tmp/backend.log 2>&1 &
          REDIS_URL="$REDIS_URL" THROTTLE_LIMIT=100000 POOL_SERVICE_PORT="$CI_POOL_PORT" pnpm start:pool > /tmp/pool.log 2>&1 &
          THROTTLE_LIMIT=100000 TRADE_SERVICE_PORT="$CI_TRADE_PORT" pnpm start:trade > /tmp/trade.log 2>&1 &
          if [[ -n "${SOLANA_RPC_URL:-}" ]]; then
            QUIET=1 bash "$GITHUB_WORKSPACE/scripts/check-rpc.sh" "$SOLANA_RPC_URL"
            echo "rpc connectivity verified"
          else
            echo "SOLANA_RPC_URL secret not configured; skipping real RPC check"
          fi
          for i in $(seq 1 60); do
            curl -sf "http://localhost:${CI_BACKEND_PORT}/health" >/dev/null &&
              curl -sf "http://localhost:${CI_TRADE_PORT}/health" >/dev/null &&
              curl -sf "http://localhost:${CI_POOL_PORT}/health" >/dev/null && break
            sleep 1
          done
          curl -sf "http://localhost:${CI_BACKEND_PORT}/health" >/dev/null
          curl -sf "http://localhost:${CI_TRADE_PORT}/health" >/dev/null
          curl -sf "http://localhost:${CI_POOL_PORT}/health" >/dev/null

      - name: Seed UI e2e trade
        working-directory: packages/backend
        run: |
          node -e "
          const { PrismaClient } = require('@prisma/client');
          const p = new PrismaClient();
          (async () => {
            await p.tradeDeal.upsert({
              where: { dealId: '900000001' },
              create: {
                id: 'ui-deal-pda',
                dealId: '900000001',
                buyerWallet: 'ui-buyer@example.com',
                sellerWallet: 'ui-seller@example.com',
                amount: 1000000n,
                downPayment: 300000n,
                poolPortion: 700000n,
                tenor: 2592000n,
                status: 'PENDING',
                createdAt: new Date(),
              },
              update: {},
            });
            await p.\$disconnect();
          })().catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Build frontend for e2e
        working-directory: packages/frontend
        run: pnpm build

      - name: Run Playwright UI e2e
        working-directory: packages/frontend
        run: pnpm test:e2e

      - name: Cleanup CI containers
        if: always()
        run: docker rm -f supply-chain-pg-ci supply-chain-redis-ci supply-chain-postgres-ci >/dev/null 2>&1 || true

  docker:
    runs-on: [self-hosted, macOS, ARM64]
    needs: [changes]
    if: needs.changes.outputs.docker == 'true' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: |
          docker build --target backend-runner -f Dockerfile.multistage \
            --build-arg ALPINE_MIRROR=https://mirrors.aliyun.com \
            --build-arg NPM_REGISTRY=https://registry.npmmirror.com \
            --build-arg HTTP_PROXY=http://host.docker.internal:7897 \
            --build-arg HTTPS_PROXY=http://host.docker.internal:7897 .

      - name: Build frontend image
        run: |
          docker build --build-arg ALPINE_MIRROR=https://mirrors.aliyun.com \
            --build-arg NPM_REGISTRY=https://registry.npmmirror.com \
            --build-arg HTTP_PROXY=http://host.docker.internal:7897 \
            --build-arg HTTPS_PROXY=http://host.docker.internal:7897 \
            --build-arg NEXT_PUBLIC_BACKEND_URL=https://api.example.com \
            --build-arg NEXT_PUBLIC_TRADE_API_URL=https://api.example.com \
            --build-arg NEXT_PUBLIC_POOL_API_URL=https://api.example.com \
            --build-arg NEXT_PUBLIC_INDEXER_API_URL=https://api.example.com \
            --build-arg NEXT_PUBLIC_RPC_URL=https://api.devnet.solana.com \
            --target frontend-runner -f Dockerfile.multistage .

  security-audit:
    runs-on: [self-hosted, macOS, ARM64]
    needs: changes
    if: needs.changes.outputs.security == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        if: runner.os == 'Linux'
        with:
          version: 9.4.0

      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Production dependency audit (block critical)
        run: pnpm audit --prod --audit-level critical --registry https://registry.npmjs.org

      - name: Secret scan (workspace + git history)
        run: bash scripts/scan-secrets.sh

  backup-drill:
    runs-on: [self-hosted, macOS, ARM64]
    needs: changes
    if: needs.changes.outputs.backup == 'true' || github.event_name == 'pull_request'
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:15632/supply_chain?connection_limit=5&schema=public
      CONTAINER: supply-chain-postgres-ci
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        if: runner.os == 'Linux'
        with:
          version: 9.4.0

      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start Postgres container
        run: |
          docker rm -f supply-chain-postgres-ci supply-chain-pg-ci supply-chain-redis-ci >/dev/null 2>&1 || true
          docker run -d --name supply-chain-postgres-ci \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=supply_chain -p 15632:5432 postgres:15
          for i in $(seq 1 30); do
            docker exec supply-chain-postgres-ci pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec supply-chain-postgres-ci pg_isready -U postgres >/dev/null
          echo "::add-mask::supply-chain-postgres-ci"

      - name: Create schema and seed
        working-directory: packages/backend
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed

      - name: Run backup restore drill
        run: |
          CONTAINER="${CONTAINER}" bash scripts/db-backup-restore.sh drill

      - name: Cleanup CI containers
        if: always()
        run: docker rm -f supply-chain-pg-ci supply-chain-redis-ci supply-chain-postgres-ci >/dev/null 2>&1 || true

  monitoring:
    runs-on: [self-hosted, macOS, ARM64]
    needs: changes
    if: needs.changes.outputs.monitoring == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Install promtool
        run: |
          case "$(uname -s)" in
            Linux) ASSET="prometheus-3.13.2.linux-amd64.tar.gz"; DIR="prometheus-3.13.2.linux-amd64" ;;
            Darwin) ASSET="prometheus-3.13.2.darwin-arm64.tar.gz"; DIR="prometheus-3.13.2.darwin-arm64" ;;
            *) echo "unsupported OS"; exit 1 ;;
          esac
          curl -sSfL --retry 3 --retry-all-errors -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v3.13.2/${ASSET}"
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          echo "/tmp/${DIR}" >> "$GITHUB_PATH"

      - name: Validate Prometheus alert rules
        run: |
          promtool check rules infra/prometheus/alerts.yml
          promtool check rules infra/prometheus/rules.yml

      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool infra/grafana/dashboards/supply-chain.json >/dev/null

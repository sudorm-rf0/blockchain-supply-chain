apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: supply-chain
  labels:
    app: supply-chain
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supply-chain
      tier: frontend
  template:
    metadata:
      labels:
        app: supply-chain
        tier: frontend
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: frontend
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: ghcr.io/example/supply-chain-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: supply-chain
spec:
  selector:
    app: supply-chain
    tier: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http

apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: supply-chain
data:
  alertmanager.yml: |
    # 部署前请用 scripts/configure-alertmanager-webhook.sh 生成
    # k8s/alertmanager-config.generated.yaml，并配置真实的
    # 钉钉/企业微信 Webhook、Slack Incoming Webhook 或 SMTP 邮件渠道。
    # deploy.sh 会优先使用 generated 配置；本文件只是占位模板。
    global:
      resolve_timeout: 5m
    route:
      receiver: default
    receivers:
      - name: default
        webhook_configs:
          - url: http://alertmanager-webhook:8080/hook
            send_resolved: true

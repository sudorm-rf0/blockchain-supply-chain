apiVersion: apps/v1
kind: Deployment
metadata:
  name: pool-service
  namespace: supply-chain
  labels:
    app: supply-chain
    tier: pool
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supply-chain
      tier: pool
  template:
    metadata:
      labels:
        app: supply-chain
        tier: pool
    spec:
      containers:
        - name: pool-service
          image: ghcr.io/example/supply-chain-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/apps/pool-service/src/main.js"]
          ports:
            - containerPort: 3005
              name: http
          env:
            - name: POOL_SERVICE_PORT
              value: "3005"
            - name: NODE_ENV
              value: "production"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_SECRET
            - name: ALLOWED_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: ALLOWED_ORIGIN
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pool-service
  namespace: supply-chain
spec:
  selector:
    app: supply-chain
    tier: pool
  ports:
    - name: http
      port: 3005
      targetPort: http

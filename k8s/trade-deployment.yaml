apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-service
  namespace: supply-chain
  labels:
    app: supply-chain
    tier: trade
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supply-chain
      tier: trade
  template:
    metadata:
      labels:
        app: supply-chain
        tier: trade
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: trade-service
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: ghcr.io/example/supply-chain-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/apps/trade-service/apps/trade-service/src/main.js"]
          ports:
            - containerPort: 3004
              name: http
          env:
            - name: TRADE_SERVICE_PORT
              value: "3004"
            - name: NODE_ENV
              value: "production"
            - name: SOLANA_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SOLANA_RPC_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_SECRET
            - name: ALLOWED_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: ALLOWED_ORIGIN
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: REDIS_URL
            - name: TRADE_FINANCE_PROGRAM_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: TRADE_FINANCE_PROGRAM_ID
                  optional: true
            - name: USDC_MINT
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: USDC_MINT
                  optional: true
            - name: LP_MINT
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: LP_MINT
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: trade-service
  namespace: supply-chain
spec:
  selector:
    app: supply-chain
    tier: trade
  ports:
    - name: http
      port: 3004
      targetPort: http

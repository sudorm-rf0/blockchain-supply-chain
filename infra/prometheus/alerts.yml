groups:
  - name: supply-chain
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"

      - alert: High5xxRate
        expr: |
          sum by (job, instance) (rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum by (job, instance) (rate(http_requests_total[5m])), 1)
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "5xx rate above 5% on {{ $labels.instance }}"

      - alert: IndexerQueueFailures
        expr: indexer_queue_jobs{status="failed"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Indexer has failed sync jobs"

      - alert: IndexerStale
        expr: time() - process_start_time_seconds{job="indexer"} > 3600
        labels:
          severity: warning
        annotations:
          summary: "Indexer process has not restarted recently; check sync lag"

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.99,
            sum by (job, instance) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency above 2s"

      - alert: HighMemoryUsage
        expr: nodejs_heap_size_used_bytes > 512 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node.js heap above 512 MiB on {{ $labels.instance }}"

      - alert: RedisDegraded
        expr: increase(redis_operation_failures[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis operation failures detected"
          description: "Redis operations failed in the last 5 minutes. incr failures mean login rate-limit (brute-force protection) is fail-open; check Redis connectivity and restore before attackers bypass lockout."

      - alert: CspViolationDetected
        expr: increase(csp_violations_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "CSP violation reported ({{ $labels.directive }})"
          description: "Browser reported a {{ $labels.directive }} violation (disposition={{ $labels.disposition }}) in the last 5 minutes."

      - alert: ProbeDown
        expr: probe_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Blackbox probe failed for {{ $labels.instance }}"
          description: "HTTP probe to {{ $labels.instance }} is failing."

      - alert: TlsCertificateWillExpireSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expires within 14 days ({{ $labels.instance }})"
          description: "Certificate for {{ $labels.instance }} expires soon; renew before it goes critical."

groups:
  - name: supply-chain
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"

      - alert: High5xxRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1)
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "5xx rate above 5% on {{ $labels.instance }}"

      - alert: IndexerQueueFailures
        expr: indexer_queue_jobs{status="failed"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Indexer has failed sync jobs"

      - alert: IndexerStale
        expr: time() - process_start_time_seconds{job="indexer"} > 3600
        labels:
          severity: warning
        annotations:
          summary: "Indexer process has not restarted recently; check sync lag"

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.99,
            sum by (job) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency above 2s"

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3001"]
        labels:
          service: backend

  - job_name: indexer
    metrics_path: /metrics
    static_configs:
      - targets: ["indexer:3003"]
        labels:
          service: indexer

  - job_name: trade
    metrics_path: /metrics
    static_configs:
      - targets: ["trade:3004"]
        labels:
          service: trade

  - job_name: pool
    metrics_path: /metrics
    static_configs:
      - targets: ["pool:3005"]
        labels:
          service: pool

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/blackbox-targets.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

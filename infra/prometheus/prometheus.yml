global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3001"]
        labels:
          service: backend

  - job_name: indexer
    metrics_path: /metrics
    static_configs:
      - targets: ["indexer:3003"]
        labels:
          service: indexer

  - job_name: trade
    metrics_path: /metrics
    static_configs:
      - targets: ["trade:3004"]
        labels:
          service: trade

  - job_name: pool
    metrics_path: /metrics
    static_configs:
      - targets: ["pool:3005"]
        labels:
          service: pool

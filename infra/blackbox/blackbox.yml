modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes:
        - 200
      follow_redirects: true

  http_2xx_tls:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes:
        - 200
      follow_redirects: true
      tls_config:
        insecure_skip_verify: false

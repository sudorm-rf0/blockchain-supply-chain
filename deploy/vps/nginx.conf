# supply-chain nginx 路由（与 k8s/ingress.yaml 保持一致）
# 首次签发证书：certbot certonly --webroot -w /var/www/certbot -d <域名>
# 之后 80 端口自动 301 到 HTTPS；证书续期：certbot renew

server_tokens off;

# HTTP -> HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://supplychain.de5.net$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name supplychain.de5.net www.supplychain.de5.net;

    ssl_certificate     /etc/letsencrypt/live/supplychain.de5.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supplychain.de5.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;
    proxy_read_timeout 60s;

    # ---- 安全响应头（Cloudflare 边缘会透传源站头）----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # ---- 静态资源缓存（配合 Cloudflare 边缘缓存）----
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    # 主后端
    location /api/meta { proxy_pass http://backend:3001; }
    location /api/auth { proxy_pass http://backend:3001; }
    location /api/files { proxy_pass http://backend:3001; }
    location /api/admin { proxy_pass http://backend:3001; }
    location /api/email-verification { proxy_pass http://backend:3001; }
    location /api/csp-report { proxy_pass http://backend:3001; }
    location /api/supply-chain { proxy_pass http://backend:3001; }
    location /health { proxy_pass http://backend:3001; }

    # 交易 / 资金池 / 索引器
    location /api/trades { proxy_pass http://trade:3004; }
    location /api/pool { proxy_pass http://pool:3005; }
    location /api/lp { proxy_pass http://pool:3005; }
    location /api/indexer { proxy_pass http://indexer:3003; }

    # 前端
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# supply-chain nginx 路由（与 k8s/ingress.yaml 保持一致）
# 首次签发证书：certbot certonly --webroot -w /var/www/certbot -d <域名>
# 之后 80 端口自动 301 到 HTTPS；证书续期：certbot renew

server_tokens off;

# Cloudflare 真实客户端 IP（2026-08-17 生成，源站 80/443 已收紧到 CF 网段，可安全信任 CF-Connecting-IP）
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Docker 内嵌 DNS：动态解析上游，容器重建/IP 变化后 nginx 自动跟随，避免 502
resolver 127.0.0.11 valid=10s ipv6=off;


# HTTP -> HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location = /d46d6f4335a1c8c98a9611a42e53c0da.txt {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://supplychain.de5.net$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name supplychain.de5.net www.supplychain.de5.net;

    ssl_certificate     /etc/letsencrypt/live/supplychain.de5.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supplychain.de5.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;
    proxy_read_timeout 60s;

    location = /d46d6f4335a1c8c98a9611a42e53c0da.txt {
        root /var/www/certbot;
        default_type text/plain;
    }

    # ---- 安全响应头（Cloudflare 边缘会透传源站头）----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # ---- 静态资源缓存（配合 Cloudflare 边缘缓存）----
    location /_next/static/ {
        set $up_frontend http://frontend:3000;
        proxy_pass $up_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    # 主后端：/api/* 统一转发到 backend（新增后端路由无需再改 nginx）。
    # 交易/资金池/索引器前缀（/api/trades 等）长于 /api/，仍优先走各自上游。
    location /api/ {
        set $up_backend http://backend:3001;
        proxy_pass $up_backend;
        # OCR/真伪分析/AI 可能超过默认 60s（多页 PDF），放宽到 300s
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Cloudflare 告警 Webhook（转发到 relay 容器 → Resend 邮件到 139 邮箱）
    location /cf-alert-webhook {
        set $up_cf_alert_relay http://cf-alert-relay:8099;
        proxy_pass $up_cf_alert_relay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header cf-webhook-auth $http_cf_webhook_auth;
        proxy_read_timeout 30s;
    }
    location /health {
        set $up_backend http://backend:3001;
        proxy_pass $up_backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 公开页面 HTML：允许 Cloudflare 边缘缓存（s-maxage=300），
    # 大陆用户访问登录/注册/验证/隐私等页面直接从边缘返回，减少回源香港的耗时。
    location ~ ^/(login|register|verify-email|change-password|verify|privacy|terms)(/.*)?$ {
        set $up_frontend http://frontend:3000;
        proxy_pass $up_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, s-maxage=300, stale-while-revalidate=60" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    # 交易 / 资金池 / 索引器（长前缀优先于 /api/）
    location /api/trades {
        set $up_trade http://trade:3004;
        proxy_pass $up_trade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/pool {
        set $up_pool http://pool:3005;
        proxy_pass $up_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/lp {
        set $up_pool http://pool:3005;
        proxy_pass $up_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/indexer {
        set $up_indexer http://indexer:3003;
        proxy_pass $up_indexer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端
    location / {
        set $up_frontend http://frontend:3000;
        proxy_pass $up_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- USD⇄USDT 托管交易前端（103-39-79-7.sslip.io / HTTPS，反代 8080）----
server {
    listen 80;
    server_name 103-39-79-7.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://103-39-79-7.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 103-39-79-7.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/103-39-79-7.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/103-39-79-7.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://172.17.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 私链 JSON-RPC（https://103-39-79-7.sslip.io/rpc -> 宿主 8545）
    location /rpc {
        proxy_pass http://172.17.0.1:8545/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

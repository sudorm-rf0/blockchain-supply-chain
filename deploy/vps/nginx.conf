# supply-chain nginx 路由（与 k8s/ingress.yaml 保持一致）
# 首次签发证书：certbot certonly --webroot -w /var/www/certbot -d <域名>
# 之后 80 端口自动 301 到 HTTPS；证书续期：certbot renew

# HTTP -> HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name supply-chain.example.com;   # 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/supply-chain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supply-chain.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;
    proxy_read_timeout 60s;

    # 主后端
    location /api/auth { proxy_pass http://backend:3001; }
    location /api/files { proxy_pass http://backend:3001; }
    location /api/admin { proxy_pass http://backend:3001; }
    location /api/csp-report { proxy_pass http://backend:3001; }
    location /health { proxy_pass http://backend:3001; }

    # 交易 / 资金池 / 索引器
    location /api/trades { proxy_pass http://trade:3004; }
    location /api/pool { proxy_pass http://pool:3005; }
    location /api/lp { proxy_pass http://pool:3005; }
    location /api/indexer { proxy_pass http://indexer:3003; }

    # 前端
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ================= VPS-A：应用机（4 后端 + 前端 + Nginx + ClamAV）=================
# 用法：cp .env.app.example .env.app && 修改后 bash scripts/deploy-vps.sh
# 说明：backend-runner 镜像内含 4 个服务入口，用不同 command 启动（与 K8s 一致）。
name: supply-chain-app

services:
  backend:
    networks: [supply-chain-net]
    build:
      context: ../..
      dockerfile: Dockerfile.multistage
      target: backend-runner
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:?required}
        NEXT_PUBLIC_TRADE_API_URL: ${NEXT_PUBLIC_TRADE_API_URL:?required}
        NEXT_PUBLIC_POOL_API_URL: ${NEXT_PUBLIC_POOL_API_URL:?required}
        NEXT_PUBLIC_INDEXER_API_URL: ${NEXT_PUBLIC_INDEXER_API_URL:?required}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:?required}
        NEXT_PUBLIC_CSP_REPORT_URI: ${NEXT_PUBLIC_CSP_REPORT_URI:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: supply-chain-backend:latest
    container_name: supply-chain-backend
    restart: unless-stopped
    command: ["npm", "run", "start"]
    env_file: [.env.app]
    environment:
      NODE_ENV: production
      PORT: "3001"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  indexer:
    networks: [supply-chain-net]
    image: supply-chain-backend:latest
    container_name: supply-chain-indexer
    restart: unless-stopped
    command: ["npm", "run", "start:indexer"]
    env_file: [.env.app]
    environment:
      NODE_ENV: production
      INDEXER_PORT: "3003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  trade:
    networks: [supply-chain-net]
    image: supply-chain-backend:latest
    container_name: supply-chain-trade
    restart: unless-stopped
    command: ["npm", "run", "start:trade"]
    env_file: [.env.app]
    environment:
      NODE_ENV: production
      TRADE_SERVICE_PORT: "3004"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3004/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  pool:
    networks: [supply-chain-net]
    image: supply-chain-backend:latest
    container_name: supply-chain-pool
    restart: unless-stopped
    command: ["npm", "run", "start:pool"]
    env_file: [.env.app]
    environment:
      NODE_ENV: production
      POOL_SERVICE_PORT: "3005"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    networks: [supply-chain-net]
    build:
      context: ../..
      dockerfile: Dockerfile.multistage
      target: frontend-runner
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:?required}
        NEXT_PUBLIC_TRADE_API_URL: ${NEXT_PUBLIC_TRADE_API_URL:?required}
        NEXT_PUBLIC_POOL_API_URL: ${NEXT_PUBLIC_POOL_API_URL:?required}
        NEXT_PUBLIC_INDEXER_API_URL: ${NEXT_PUBLIC_INDEXER_API_URL:?required}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:?required}
        NEXT_PUBLIC_CSP_REPORT_URI: ${NEXT_PUBLIC_CSP_REPORT_URI:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: supply-chain-frontend:latest
    container_name: supply-chain-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  clamav:
    networks: [supply-chain-net]
    image: clamav/clamav:stable
    container_name: supply-chain-clamav
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 5 >/dev/null 2>&1"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s

  nginx:
    networks: [supply-chain-net]
    image: nginx:1.27-alpine
    container_name: supply-chain-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.http.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - backend
      - trade
      - pool
      - indexer
      - frontend

volumes:
  uploads:
  clamav_db:

networks:
  supply-chain-net:
    external: true

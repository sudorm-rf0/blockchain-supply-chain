# supply-chain nginx 测试模式（HTTP，IP 直连，无 TLS）
# 由 deploy/vps/app-compose.test.yml 覆盖挂载此配置。
# 正式上线请改用 nginx.conf（TLS + 域名）。
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME 校验（证书签发/续期）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 50m;
    proxy_read_timeout 60s;

    # 主后端
    location /api/auth    { proxy_pass http://backend:3001; }
    location /api/files   { proxy_pass http://backend:3001; }
    location /api/admin   { proxy_pass http://backend:3001; }
    location /api/csp-report { proxy_pass http://backend:3001; }
    location /api/financing { proxy_pass http://backend:3001; }
    location /api/supply-chain { proxy_pass http://backend:3001; }
    location /api/email-verification { proxy_pass http://backend:3001; }
    location /api/meta    { proxy_pass http://backend:3001; }
    location /api/public  { proxy_pass http://backend:3001; }
    location /api/notifications { proxy_pass http://backend:3001; }
    location /api/feedback { proxy_pass http://backend:3001; }
    location /health      { proxy_pass http://backend:3001; }

    # 交易 / 资金池 / 索引器
    location /api/trades  { proxy_pass http://trade:3004; }
    location /api/pool    { proxy_pass http://pool:3005; }
    location /api/lp      { proxy_pass http://pool:3005; }
    location /api/indexer { proxy_pass http://indexer:3003; }

    # 前端
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

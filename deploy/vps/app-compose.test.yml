# 单机测试 override（与 app-compose.yml 一起使用）：
#   1) nginx 使用 ./nginx.conf（TLS；测试阶段可用 nginx.http.conf 覆盖）
#   2) 各服务端口仅绑定 127.0.0.1，方便 VPS 本机 curl 健康检查（不对外暴露）
#   3) 容器内通过 host.docker.internal 访问宿主机上的 Postgres/Redis（单机测试）
# 用法：
#   docker compose --env-file .env.app \
#     -f app-compose.yml -f app-compose.test.yml up -d
# 注意：单机测试时 .env.app 的 DATABASE_URL / REDIS_URL 主机应写 host.docker.internal
services:
  backend:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3001:3001"
  indexer:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3003:3003"
  trade:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3004:3004"
  pool:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3005:3005"
  frontend:
    ports:
      - "127.0.0.1:3000:3000"
  nginx:
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

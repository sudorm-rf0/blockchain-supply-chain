name: supply-chain

services:
  postgres:
    image: postgres:15
    container_name: supply-chain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supply_chain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supply_chain"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: supply-chain-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  solana-localnet:
    platform: linux/amd64
    build:
      context: ./infra/localnet
    image: supply-chain-localnet:agave-4.1.2
    container_name: supply-chain-solana-localnet
    command:
      [
        "solana-test-validator",
        "--ledger",
        "/var/solana/ledger",
        "--gossip-host",
        "127.0.0.1",
        "--gossip-port",
        "8002",
        "--tpu-port",
        "8001",
        "--tpu-quic-port",
        "8003",
      ]
    ports:
      - "8899:8899"
      - "8900:8900"
      - "9900:9900"
      - "8001:8001/tcp"
      - "8001:8001/udp"
      - "8002:8002/tcp"
      - "8002:8002/udp"
      - "8003:8003/tcp"
      - "8003:8003/udp"
    volumes:
      - solana_ledger:/var/solana/ledger
      - solana_config:/root/.config/solana

volumes:
  postgres_data:
  redis_data:
  solana_ledger:
  solana_config:
